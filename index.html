<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>main_project_front</title>
  </head>
  <body>

        <!-- 리액트는 SPA(Single Page Application = .html 1개) 구조 -->
    <!-- 리액트는 div 안에 JS 이용해서 내용물을 넣어주는 구조 -->
    <!-- 모든 HTML 들은 ROOT 에 포함됨 -->
    <div id="root"></div>

    <!-- 최초로 ROOT 에 .innerHTML 해주는 메인 코드가  main.jsx 에 포함됨 -->
    <!-- .innerHTML('특정 마크업 ID/Class') : 특정 마크업 안에 내용물 대입 -->
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
